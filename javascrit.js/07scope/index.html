<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let gloalvar = "hii i am global"

        function greet(){

            let localvar = "hi i am inside function"

            if(true){
                let blockvar = "hi i am inside block"

                console.log(globalvar) //work everywhare
                console.log(localvar)//can be called inside the function only 
                console.log(blockvar)//will be work only inside the block
            }

        }
        greet()

        //1. Global scope
// let globalvar = "hi i am global";
// This variable is declared outside the function, so it can be accessed from inside the function and the if block.
// Accessible inside both areas ✓
// 2. Function scope
// let localvar = "hi i am inside function";
// This variable is declared inside greet(), so it can be used inside that function, including its inner if block.
// Accessible inside the function ✓
// 3. Block scope
// let blockvar = "hi i am inside block";
// This variable is declared inside if (true), so it can be used only inside that block.
// Accessible inside the if block ✓
    </script>
</body>
</html>
