    <script> 

        //loops -repating same task

        //1.for loop(strting ; ending ; operators = ++/--)
    // golden rule = when condition true loop starts when condition is fals loop stos

        //print number 1 to 10 

    for(let i = 1;i <= 10; i++){
        console.log("the value is",i)
     }
     //print 10 to 1 

    for(let j = 10; j >= 1 ; j--){
        console.log("the value is",j)
    }

    //no start or end point - while loop

    let count = 1
    while(count <=5){
        console.log("good evening Everyone") //prints infinet number if only we write the things until here if we add count++ this will stops bcz it will become 6
        count ++;// just to stop the loop

    }

    let number = 7
