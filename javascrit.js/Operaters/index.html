    // <!-- operaters are used to performs action on data -->
    //  arithemetic operation

    let x = 10

    console.log(x+y)

    console.log(x/y)
    console.log(x%y) // reminder //10(if not like its smaller number so right left number in this case)
    console.log(2%10)


    //assignment operation

    let score = 3

    console.log(score)
 

    //bollian formate

    console.log(10>4)
    console.log(10<5)

    console.log(20 >= 20)
    console.log(5 <= 5)
    
    // == checks the value

    let price1 = 100
    let price2 = "100"
    console.log(price1 == price2)//cheks value not data type //true

    // === this checks the data type

    console.log(price1 === price2) //False
