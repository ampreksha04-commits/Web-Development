             }else{
                return("odd number")
             }
        }

        console.log(result)


        //Prime number 
        //1. nor prime mot composite

        function prime(n) {

            if(n===1){
                return("not an prime number")
            }
            if(n%2 === 0){
                return false
            }
            if(n===2){
                return true
            }

            //Logic for reverse string

            let name = "john";
            let reverstring = "";

            for (let i = name.length-1;i >= 0 ; i--){
                reverstring = reverstring+name[i]
            }
            console.log(reverstring)
        }
