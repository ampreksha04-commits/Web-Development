<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family:Arial;
            background-color: white;
            display:flex;
            justify-content: center;
            gap:22px;
            align-items: center;
            flex-wrap: wrap;
        }
        .product{
            border: 1px solid black;
            width: 250px;
            border-radius: 12px;
            padding:20px ;
            text-align: center;
            margin-bottom:15px ;
            box-shadow: 4px 4px 8px black ;


        }

        .product img{
            width:100% ;
            height: 160px;
            object-fit: cover;

        }

        .product:hover{
            background-color: #a77a7a;
            color: white;
            transition: 2s;
            transform: scale(3s);
        }

        .product button{
            padding: 10px;
            background-color: #4d4747;
            border-radius: 5px;
            color: #a77a7a;
        }
        .product p{
            color: black;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="product">
        <img src="https://images.pexels.com/photos/15487609/pexels-photo-15487609.jpeg">
        <h2>HeadPhones</h2>
        <p>3000</p>
        <button>Buy Now</button>
    </div>

     <div class="product">
        <img src="https://images.pexels.com/photos/11744247/pexels-photo-11744247.jpeg">
        <h2>Camera</h2>
        <p>10000</p>
        <button>Buy Now</button>
    </div>

     <div class="product">
        <img src="https://images.pexels.com/photos/27426618/pexels-photo-27426618.jpeg">
        <h2>Shoes</h2>
        <p>2000</p>
        <button>Buy Now</button>
    </div>
</body>
</html>
