<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: blue;
            width:300px;
            height:200px;
            border: 2px solid black;
            border-radius: 20px;
            margin: 20px;
            padding: 10px;
            box-sizing: border-box;
        }

        div p{
            border-bottom: 2px double red;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>Hello Guys</p>
    </div>
    <div class="box">
        <p>books</p>
    </div>
</body>
</html>
