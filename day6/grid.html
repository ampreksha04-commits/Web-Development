<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product{
            display: grid;
            grid-template-columns: 200px 200px;
           gap: 20px;
        }
        .box{
            border: 1px solid black;
            padding:20px;
            text-align: center;
            color: black;
             background-color: aqua;
        }
        /* grid template-columns=200px 200px 400px */

        /* grid templet columns :1fr 1fr 1fr means fractinal ratio , so depends on screen like mibile laptop  */
        /* so we use grid templet repaet(7,1fr) */ 
        /* so in that case we use reapeat(auto-fit,minmax(250px,1fr)) */
    </style>
</head>
<body>
    <div class="product">
        <div class="box">cake</div>
        <div class="box">cake-prize</div>
        <div class="box">Cookies</div>
        <div class="box">Cokies-prize</div>
        <div class="box">Pastry</div>
        <div class="box">Pastry-prize</div>
    </div>
</body>
</html>
